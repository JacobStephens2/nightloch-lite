# Nightloch - persistent forwarding for the tunnel.
#
# Install at /etc/sysctl.d/99-nightloch-forward.conf. This is the half of the
# NAT posture the kernel remembers across a reboot; the rules themselves are
# nightloch-nat.nft, loaded by nightloch-nat.service.

# The host carries tunnel traffic to the internet.
net.ipv4.ip_forward = 1

# IPv6 forwarding stays off, deliberately. A Device routes ::/0 into the tunnel
# and holds no v6 address of its own, so leaving this off makes v6 a blackhole
# rather than a path around the resolver. Blackhole is the product's stated
# fail mode; a dual-stack network resolving around enforcement is not.
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0
